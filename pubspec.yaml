name: bubblepaw_desktop
description: BubblePaw Desktop, the desktop app shell for BubblePaw on the BubbleBuffer agent kit.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  agent_kit:
    git:
      url: https://github.com/BubbleBuffer/agent-kit
      ref: d5a9871bce7fcbd91df119667db1585f24527ba1 # v0.16.3
      path: packages/agent_kit
  agent_kit_core:
    git:
      url: https://github.com/BubbleBuffer/agent-kit
      ref: d5a9871bce7fcbd91df119667db1585f24527ba1 # v0.16.3
      path: packages/agent_kit_core
  agent_kit_bubblepaw:
    git:
      url: https://github.com/BubbleBuffer/agent-kit
      ref: d5a9871bce7fcbd91df119667db1585f24527ba1 # v0.16.3
      path: packages/agent_kit_bubblepaw
  # Same pin as the kit's own, so the primitives come from one place.
  bb_ui:
    git:
      url: https://github.com/BubbleBuffer/bb-ui
      ref: v0.6.0
      path: packages/bb_ui
  # SHA256 of downloaded app updates (dart:io has no hash).
  crypto: ^3.0.6
  file_selector: ^1.1.0
  # Core, embedded through bubblepaw-sdk (native/), and its Dart bridge.
  bubblepaw_desktop_native:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  # Tray, window hiding and login start. tray_manager stays on the classic
  # plugin (0.5.x): 0.7+ builds on native assets.
  tray_manager: 0.8.0
  window_manager: 0.5.2
  launch_at_startup: 0.5.1
  # The same pin as bb_ui's, for the Lucide glyphs its Ico enum lacks.
  lucide_icons_flutter: 3.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/fonts/licenses/
    - assets/icon/tray/
    - assets/icon/png/icon-128.png
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque[opsz,wdth,wght].ttf
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext[wght].ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic[wght].ttf
          style: italic
    - family: Fragment Mono
      fonts:
        - asset: assets/fonts/FragmentMono-Regular.ttf
        - asset: assets/fonts/FragmentMono-Italic.ttf
          style: italic
