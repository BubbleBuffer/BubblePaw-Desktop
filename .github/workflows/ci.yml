# GitHub-hosted runner (the repository is public, so hosted minutes are free).
# One job runs every check in turn; each step runs even when an earlier one failed.
name: ci

on:
  # Docs, mockups and licence text cannot change the build, the tests or the goldens.
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE*'
      - 'NOTICE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE*'
      - 'NOTICE*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: format, analyze, test, goldens, native host
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - run: flutter pub get
      - name: dart format
        if: always()
        run: dart format --output=none --set-exit-if-changed lib test
      - name: flutter analyze
        if: always()
        run: flutter analyze
      - name: flutter test
        if: always()
        run: flutter test --exclude-tags "golden || native"
      # Goldens are rendered on Linux with the bundled fonts. To accept new
      # renders, run this workflow by hand (workflow_dispatch): the last step
      # formats the code, re-renders the goldens and uploads the result as
      # fix.patch (`git apply fix.patch`).
      - name: goldens
        if: always()
        run: flutter test --tags golden
      - name: Save golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: test/failures
          if-no-files-found: ignore
      - name: native crate (fmt, clippy, tests)
        if: always()
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml
      # Scripted provider only: no model is called. The Dart FFI transport
      # runs against the crate built here.
      - name: native host (FFI transport, real crate)
        if: always()
        run: |
          cargo build --manifest-path native/Cargo.toml
          flutter test --tags native test/native_host_test.dart
      # Catches native breakage: the plugin registrants, the tray's
      # libayatana-appindicator and the runner changes.
      - name: linux build (debug)
        if: always()
        run: |
          missing=""
          for p in clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq $missing
          fi
          flutter build linux --debug
      - name: Patch with formatting and new goldens (manual runs)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          dart format lib test
          flutter test --tags golden --update-goldens || true
          rm -rf test/failures
          git add -N .
          git diff --binary > fix.patch
          # The log carries the patch too, for when artifact storage is full:
          # join the lines between the markers, then base64 -d | gunzip | git apply
          echo "PATCH-BEGIN"
          gzip -9 < fix.patch | base64 -w 2000
          echo "PATCH-END"
      - name: Save patch
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-patch
          path: fix.patch
          if-no-files-found: ignore

  windows:
    name: windows build, native host
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: flutter pub get
      - name: native crate tests
        if: always()
        run: cargo test --manifest-path native/Cargo.toml
      - name: native host (FFI transport, real crate)
        if: always()
        run: |
          cargo build --manifest-path native/Cargo.toml
          flutter test --tags native test/native_host_test.dart
      - name: windows build (debug)
        if: always()
        run: flutter build windows --debug
