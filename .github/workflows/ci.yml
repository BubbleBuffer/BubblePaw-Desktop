# GitHub-hosted runner (the repository is public, so hosted minutes are free).
# One job runs every check in turn; each step runs even when an earlier one failed.
name: ci

on:
  # Docs, mockups and licence text cannot change the build, the tests or the goldens.
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE*'
      - 'NOTICE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE*'
      - 'NOTICE*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: format, analyze, test, goldens, native host
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      # tray_manager's native assets (nativeapi) compile against GTK 3, X11 and Xi.
      - name: Linux desktop development files
        run: sudo apt-get install -y -qq pkg-config libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get
      - name: dart format
        if: always()
        run: dart format --output=none --set-exit-if-changed lib test
      - name: flutter analyze
        if: always()
        run: flutter analyze
      - name: flutter test
        if: always()
        run: flutter test --exclude-tags "golden || native"
      # Goldens are rendered on Linux with the bundled fonts. To accept new
      # renders, run this workflow by hand (workflow_dispatch): the last step
      # regenerates the flutter_rust_bridge code, formats the code, re-renders
      # the goldens and uploads the result as fix.patch (`git apply fix.patch`).
      - name: goldens
        if: always()
        run: flutter test --tags golden
      - name: Save golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: test/failures
          if-no-files-found: ignore
      - name: native crate (fmt, clippy, tests)
        if: always()
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml
      # The phone build: the same crate without the embedded host. The test
      # pairs with and opens an in-process host through a local relay.
      - name: native crate, remote only (clippy, tests)
        if: always()
        run: |
          cargo clippy --manifest-path native/Cargo.toml --all-targets --no-default-features -- -D warnings
          cargo test --manifest-path native/Cargo.toml --no-default-features
      # Scripted provider only: no model is called. The Dart FFI transport
      # runs against the crate built here.
      - name: native host (FFI transport, real crate)
        if: always()
        run: |
          cargo build --manifest-path native/Cargo.toml
          flutter test --tags native test/native_host_test.dart
      # Catches native breakage: the plugin registrants, the tray's native
      # asset (GTK 3, X11, Xi) and the runner changes.
      - name: linux build (debug)
        if: always()
        run: |
          missing=""
          for p in clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq $missing
          fi
          flutter build linux --debug
      - name: Patch with formatting and new goldens (manual runs)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          # The bridge code follows native/src/api (committed, regenerated here).
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          flutter_rust_bridge_codegen generate
          dart format lib test
          flutter test --tags golden --update-goldens || true
          rm -rf test/failures
          git add -N .
          git diff --binary > fix.patch
          # The log carries the patch too, for when artifact storage is full:
          # join the lines between the markers, then base64 -d | gunzip | git apply
          echo "PATCH-BEGIN"
          gzip -9 < fix.patch | base64 -w 2000
          echo "PATCH-END"
      - name: Save patch
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-patch
          path: fix.patch
          if-no-files-found: ignore

  licences:
    name: crate licences up to date
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: cargo-about (pinned)
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      # Fails on a crate whose licence is not in native/about.toml.
      - name: regenerate assets/licences
        run: bash tool/licences.sh
      # To accept new licences, run this workflow by hand (workflow_dispatch)
      # and `git apply licences.patch` from the licences-patch artifact.
      - name: Patch with the regenerated licences (manual runs)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p assets/licences && git add -N assets/licences
          git diff --binary -- assets/licences > licences.patch
      - name: Save patch
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licences-patch
          path: licences.patch
          if-no-files-found: ignore
      - name: committed licences match native/Cargo.lock
        run: |
          mkdir -p assets/licences && git add -N assets/licences
          if ! git diff --exit-code --stat -- assets/licences; then
            echo "::error::assets/licences is stale against native/Cargo.lock. Run tool/licences.sh (needs cargo-about 0.9.3) or run this workflow by hand and apply licences.patch."
            exit 1
          fi

  windows:
    name: windows build, native host
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: flutter pub get
      - name: native crate tests
        if: always()
        run: cargo test --manifest-path native/Cargo.toml
      - name: native host (FFI transport, real crate)
        if: always()
        run: |
          cargo build --manifest-path native/Cargo.toml
          flutter test --tags native test/native_host_test.dart
      - name: windows build (debug)
        if: always()
        run: flutter build windows --debug

  android:
    name: phone app (arm64 debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-linux-android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - run: flutter pub get
      - name: android project
        run: |
          flutter create --platforms=android --org cc.breadcat --project-name bubblepaw_desktop .
          python3 tool/android_setup.py
      - name: native crate for arm64 (remote client only)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd native
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --no-default-features
      - name: apk (debug-signed)
        run: flutter build apk --debug -t lib/main_phone.dart --target-platform android-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bubblepaw-phone-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  android-smoke:
    name: phone app starts on an emulator (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add x86_64-linux-android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - run: flutter pub get
      - name: android project
        env:
          ANDROID_ABI: x86_64
        run: |
          flutter create --platforms=android --org cc.breadcat --project-name bubblepaw_desktop .
          python3 tool/android_setup.py
      - name: native crate for x86_64 (remote client only)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd native
          cargo ndk -t x86_64 -o ../android/app/src/main/jniLibs build --release --no-default-features
      - name: apk (debug, x86_64, for the emulator only)
        run: flutter build apk --debug -t lib/main_phone.dart --target-platform android-x64
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: launch on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          script: bash tool/android_smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phone-emulator-screenshot
          path: smoke.png
          if-no-files-found: ignore
