name: Nightly desktop

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize the complete check/build/publish cycle, including manual runs.
concurrency:
  group: desktop-nightly
  cancel-in-progress: false

jobs:
  prepare:
    name: Check current main against published nightly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual dispatches also always build main, regardless of the selected ref.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pin the source commit for all jobs
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Skip only a complete nightly at this exact commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: >-
          python installer/publish_release.py nightly-check --sha "$SOURCE_SHA"
          --output "$GITHUB_OUTPUT"

  release:
    name: Build and publish nightly
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
      source_sha: ${{ needs.prepare.outputs.sha }}
