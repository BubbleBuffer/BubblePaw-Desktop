# cargo-about config for the phone app (the client-only build: the crate
# without default features). tool/licences.sh turns the result into
# assets/licences/phone-crates.json. Same as native/about.toml except for
# the targets; keep the two in step.

accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "MIT-0",
    "CDLA-Permissive-2.0",
]

# What the phone build ships (arm64 Android).
targets = [
    "aarch64-linux-android",
]

# Dev dependencies are only for tests. Build dependencies stay listed.
ignore-dev-dependencies = true

# The embedded BubblePaw Core and the app's own native crate are the same
# project's own code, under the same licence as this app (see LICENSE).
[bubblepaw_desktop_native]
accepted = ["AGPL-3.0-only"]
[bubblepaw-core]
accepted = ["AGPL-3.0-only"]
[bubblepaw-mcp]
accepted = ["AGPL-3.0-only"]
[bubblepaw-process]
accepted = ["AGPL-3.0-only"]
[bubblepaw-runner]
accepted = ["AGPL-3.0-only"]
[bubblepaw-sdk]
accepted = ["AGPL-3.0-only"]
[bubblepaw-remote]
accepted = ["AGPL-3.0-only"]
